<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training log — A/B</title>
<meta name="theme-color" content="#E8EAE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<style>
  :root{
    --bg:#E8EAE7;
    --card:#FFFFFF;
    --ink:#1B2021;
    --muted:#6B7370;
    --line:#D3D7D2;
    --a:#1F5F8B;
    --a-soft:#E4EDF4;
    --b:#AC5019;
    --b-soft:#F6E9DF;
    --ok:#2E6B4F;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px;line-height:1.45;
    font-variant-numeric:tabular-nums;
    padding:20px 16px calc(96px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;
  }
  h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
  input{font-family:inherit;font-size:16px;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
  input:focus-visible,button:focus-visible{outline:2px solid var(--a);outline-offset:2px}

  /* choice */
  .choose{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pick{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 14px 13px;text-align:left;display:block;min-height:104px;position:relative;
    transition:border-color .12s ease, transform .12s ease;
  }
  .pick:active{transform:scale(.985)}
  .pick .letter{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em}
  .pick .what{font-size:13.5px;margin-top:3px}
  .pick .when{font-size:12.5px;color:var(--muted);margin-top:9px}
  .pick.a .letter{color:var(--a)} .pick.b .letter{color:var(--b)}
  .pick.on{border-color:currentColor;border-width:2px;padding:13px 13px 12px}
  .pick.a.on{color:var(--a);background:var(--a-soft)}
  .pick.b.on{color:var(--b);background:var(--b-soft)}
  .pick.on .what,.pick.on .when{color:var(--ink)}
  .next{position:absolute;top:12px;right:12px;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 8px;background:#fff}

  /* movements */
  .work{margin-top:22px}
  .mv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 13px 12px;margin-bottom:9px}
  .mv h3{margin:0;font-size:15.5px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .mv h3 span{font-size:12.5px;font-weight:400;color:var(--muted);white-space:nowrap}
  .fields{display:grid;grid-template-columns:112px 1fr;gap:8px;margin-top:10px}
  .last{margin:9px 0 0;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .repeat{border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:500;background:#fff}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .note{margin-top:8px}
  .flag{font-size:12.5px;color:var(--muted);border-left:2px solid var(--b);padding:2px 0 2px 10px;margin:14px 0 0}

  /* sticky save */
  .bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 68%,rgba(232,234,231,0));}
  .bar .inner{max-width:560px;margin:0 auto;display:flex;gap:8px}
  .save{flex:1;background:var(--ink);color:#fff;border-radius:12px;padding:15px;font-weight:600;font-size:16.5px}
  .save[disabled]{opacity:.38}
  .ghost{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;font-weight:500}

  /* history */
  .hist{margin-top:30px;border-top:1px solid var(--line);padding-top:18px}
  .hist h2{font-size:15px;font-weight:600;margin:0 0 2px}
  .count{color:var(--muted);font-size:13px;margin:0 0 14px}
  .row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin-bottom:8px}
  .row .head{display:flex;align-items:center;gap:9px}
  .tag{font-weight:700;font-size:13px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none}
  .tag.a{background:var(--a-soft);color:var(--a)} .tag.b{background:var(--b-soft);color:var(--b)}
  .stamp{font-size:13.5px;font-weight:500}
  .row .rest{margin-left:auto;font-size:12.5px;color:var(--muted)}
  .lifts{margin:9px 0 0;font-size:13px;color:#39413E;white-space:pre-wrap;line-height:1.55}
  .acts{display:flex;gap:14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
  .acts button{text-decoration:underline;text-underline-offset:3px}
  .exportall{display:block;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;font-weight:500;font-size:14.5px;margin-top:4px}
  .exportall:active{transform:scale(.99)}
  .empty{color:var(--muted);font-size:13.5px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:16px}
  .toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .18s,transform .18s}
  .toast.show{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="top"><h1>Training log</h1><span id="bank" class="stamp" style="color:var(--muted)"></span></div>
<p class="sub">Pick today's session, fill what you lifted, save it. Held load is the win.</p>

<div class="choose">
  <button class="pick a" id="pickA" aria-pressed="false">
    <span class="next" id="nextA" hidden>up next</span>
    <span class="letter">A</span>
    <span class="what">Pull &amp; hinge</span>
    <span class="when" id="whenA">not done yet</span>
  </button>
  <button class="pick b" id="pickB" aria-pressed="false">
    <span class="next" id="nextB" hidden>up next</span>
    <span class="letter">B</span>
    <span class="what">Push &amp; squat</span>
    <span class="when" id="whenB">not done yet</span>
  </button>
</div>

<div class="work" id="work" hidden>
  <div id="moves"></div>
  <div class="meta">
    <input id="bw" type="text" inputmode="decimal" placeholder="Bodyweight kg">
    <input id="cardio" type="text" inputmode="numeric" placeholder="Incline mins">
  </div>
  <input class="note" id="note" type="text" placeholder="One note, if anything felt off">
  <p class="flag" id="flag" hidden>Standing lifts today. Lightheadedness under the bar is a stop signal, not something to push through.</p>
</div>

<section class="hist">
  <h2>Ledger</h2>
  <p class="count" id="count">Loading…</p>
  <div id="rows"></div>
  <button class="exportall" id="exportAll" hidden>Copy all sessions</button>
</section>

<div class="bar" id="bar" hidden>
  <div class="inner">
    <button class="save" id="save">Save session</button>
    <button class="ghost" id="cancel">Clear</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const KEY = 'training-log-v1';
const PLAN = {
  A: {name:'Pull & hinge', flag:false, moves:[
    {n:'Weighted pull-up',       t:'4 × 5–8'},
    {n:'Barbell bent-over row',  t:'3 × 6–10'},
    {n:'Romanian deadlift',      t:'3 × 8–10'},
    {n:'Lateral raise',          t:'3 × 12–15'},
    {n:'Weighted hanging leg raise', t:'3 × 8–12'}
  ]},
  B: {name:'Push & squat', flag:true, moves:[
    {n:'Weighted dip',           t:'4 × 5–8'},
    {n:'Standing overhead press',t:'3 × 5–8'},
    {n:'Bulgarian split squat',  t:'3 × 8–10 / leg'},
    {n:'Lateral raise',          t:'3 × 12–15'},
    {n:'Weighted hanging leg raise', t:'3 × 8–12'}
  ]}
};

let state = {sessions:[], draft:null};
let active = null;

/* ---------- storage ---------- */
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){ /* first run, or storage unreadable */ }
  if(!state.sessions) state.sessions = [];
}
function persist(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
  }catch(e){
    toast('Could not save to this device. Copy the session text before closing.');
  }
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const last = type => state.sessions.filter(s=>s.type===type)[0] || null;
function ago(iso){
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if(d <= 0) return 'today';
  if(d === 1) return 'yesterday';
  return d + ' days ago';
}
function stamp(iso){
  return new Date(iso).toLocaleString(undefined,
    {weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit'});
}
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._x); t._x = setTimeout(()=>t.classList.remove('show'), 2600);
}
function liftLines(s){
  return s.lifts.filter(l=>l.weight||l.reps)
    .map(l => l.n + (l.weight ? ' ' + l.weight : '') + (l.reps ? ': ' + l.reps : '')).join('\n');
}
function asText(s){
  const parts = [new Date(s.ts).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}) + ' — Session ' + s.type];
  parts.push(liftLines(s));
  if(s.bw) parts.push('Bodyweight ' + s.bw + 'kg');
  if(s.cardio) parts.push('Incline ' + s.cardio + ' min');
  if(s.note) parts.push('Note: ' + s.note);
  return parts.filter(Boolean).join('\n');
}
function allText(){
  return state.sessions.map(asText).join('\n\n');
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast('Copied'); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('Copied'); }catch(_){ toast('Select and copy manually'); }
    ta.remove();
  }
}

/* ---------- header / choice ---------- */
function paintHeader(){
  const total = state.sessions.length;
  $('bank').textContent = total ? total + ' logged' : '';
  ['A','B'].forEach(t=>{
    const l = last(t);
    $('when'+t).textContent = l ? 'last ' + ago(l.ts) : 'not done yet';
  });
  const recent = state.sessions[0];
  const due = recent ? (recent.type === 'A' ? 'B' : 'A') : 'A';
  $('nextA').hidden = due !== 'A';
  $('nextB').hidden = due !== 'B';
}

function choose(type){
  if(active === type){ return; }
  if(active && dirty() && !confirm('Switch session? What you typed will be cleared.')) return;
  active = type;
  ['A','B'].forEach(t=>{
    const el = $('pick'+t);
    el.classList.toggle('on', t === type);
    el.setAttribute('aria-pressed', String(t === type));
  });
  const useDraft = state.draft && state.draft.type === type ? state.draft : null;
  buildForm(type, useDraft);
  $('work').hidden = false; $('bar').hidden = false;
  $('flag').hidden = !PLAN[type].flag;
  $('work').scrollIntoView({behavior:'smooth', block:'start'});
}

function buildForm(type, draft){
  const prev = last(type);
  $('moves').innerHTML = PLAN[type].moves.map((m,i)=>{
    const p = prev ? prev.lifts.find(l=>l.n === m.n) : null;
    const d = draft ? draft.lifts.find(l=>l.n === m.n) : null;
    const w = d ? d.weight : (p ? p.weight : '');
    const r = d ? d.reps : '';
    const hint = p && (p.weight || p.reps)
      ? '<p class="last">Last: ' + [p.weight, p.reps].filter(Boolean).join(' — ') +
        '<button class="repeat" data-rep="' + i + '">Same again</button></p>' : '';
    return '<div class="mv">' +
      '<h3>' + m.n + '<span>' + m.t + '</span></h3>' +
      '<div class="fields">' +
        '<input type="text" id="w' + i + '" value="' + esc(w) + '" placeholder="Load" aria-label="Load for ' + esc(m.n) + '">' +
        '<input type="text" id="r' + i + '" value="' + esc(r) + '" inputmode="numeric" placeholder="Reps e.g. 8, 7, 6" aria-label="Reps for ' + esc(m.n) + '">' +
      '</div>' + hint + '</div>';
  }).join('');
  $('bw').value    = draft ? (draft.bw || '')     : '';
  $('cardio').value= draft ? (draft.cardio || '') : '';
  $('note').value  = draft ? (draft.note || '')   : '';

  $('moves').querySelectorAll('[data-rep]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const i = +b.dataset.rep, p = last(type).lifts.find(l=>l.n === PLAN[type].moves[i].n);
      $('w'+i).value = p.weight || ''; $('r'+i).value = p.reps || ''; saveDraft();
    });
  });
  document.querySelectorAll('#work input').forEach(el=>el.addEventListener('input', saveDraft));
  $('save').disabled = !dirty();
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function collect(){
  return {
    type: active,
    lifts: PLAN[active].moves.map((m,i)=>({n:m.n, weight:$('w'+i).value.trim(), reps:$('r'+i).value.trim()})),
    bw: $('bw').value.trim(), cardio: $('cardio').value.trim(), note: $('note').value.trim()
  };
}
function dirty(){
  if(!active) return false;
  const d = collect();
  return d.lifts.some(l=>l.reps) || !!d.bw || !!d.cardio || !!d.note;
}
let dt;
function saveDraft(){
  $('save').disabled = !dirty();
  clearTimeout(dt);
  dt = setTimeout(()=>{ state.draft = collect(); persist(); }, 600);
}

/* ---------- save + ledger ---------- */
function saveSession(){
  if(!dirty()) return;
  const s = collect();
  s.ts = new Date().toISOString();
  s.id = s.ts + Math.random().toString(36).slice(2,6);
  state.sessions.unshift(s);
  state.draft = null;
  persist();
  active = null;
  ['A','B'].forEach(t=>{ $('pick'+t).classList.remove('on'); $('pick'+t).setAttribute('aria-pressed','false'); });
  $('work').hidden = true; $('bar').hidden = true;
  paintHeader(); paintLedger();
  toast('Session ' + s.type + ' saved — ' + stamp(s.ts));
  window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
}

function paintLedger(){
  const n = state.sessions.length;
  $('count').textContent = n ? n + ' session' + (n>1?'s':'') + ' on this device' : '';
  $('exportAll').hidden = !n;
  $('exportAll').textContent = n > 1 ? 'Copy all ' + n + ' sessions' : 'Copy all sessions';
  if(!n){ $('rows').innerHTML = '<p class="empty">Nothing logged yet. Pick A or B above and your first session lands here with its date and time.</p>'; return; }
  $('rows').innerHTML = state.sessions.map(s =>
    '<div class="row"><div class="head">' +
      '<span class="tag ' + s.type.toLowerCase() + '">' + s.type + '</span>' +
      '<span class="stamp">' + stamp(s.ts) + '</span>' +
      '<span class="rest">' + ago(s.ts) + (s.bw ? ' · ' + s.bw + 'kg' : '') + '</span>' +
    '</div>' +
    (liftLines(s) ? '<p class="lifts">' + esc(liftLines(s)) + '</p>' : '') +
    (s.note ? '<p class="lifts">' + esc(s.note) + '</p>' : '') +
    '<div class="acts"><button data-copy="' + s.id + '">Copy</button>' +
    '<button data-del="' + s.id + '">Delete</button></div></div>'
  ).join('');
  $('rows').querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>
    copy(asText(state.sessions.find(x=>x.id === b.dataset.copy)))));
  $('rows').querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Delete this session?')) return;
    state.sessions = state.sessions.filter(x=>x.id !== b.dataset.del);
    persist(); paintHeader(); paintLedger();
  }));
}

/* ---------- wire up ---------- */
$('pickA').addEventListener('click', ()=>choose('A'));
$('pickB').addEventListener('click', ()=>choose('B'));
$('save').addEventListener('click', saveSession);
$('exportAll').addEventListener('click', ()=>{
  if(!state.sessions.length) return;
  copy(allText());
});
$('cancel').addEventListener('click', ()=>{
  if(dirty() && !confirm('Clear what you typed?')) return;
  state.draft = null; persist();
  active = null;
  ['A','B'].forEach(t=>{ $('pick'+t).classList.remove('on'); $('pick'+t).setAttribute('aria-pressed','false'); });
  $('work').hidden = true; $('bar').hidden = true;
});

(function init(){
  load();
  paintHeader(); paintLedger();
  if(state.draft && state.draft.type){
    choose(state.draft.type);
    toast('Picked up where you left off');
  }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* offline shell unavailable; app still runs */ });
  });
}
</script>
</body>
</html>
